[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
rb-common = { path = "crates/rb-common" }
rb-config = { path = "crates/rb-config" }
rb-adapter = { path = "crates/rb-adapter" }
rb-rule = { path = "crates/rb-rule" }
rb-dns = { path = "crates/rb-dns" }
rb-route = { path = "crates/rb-route" }
rb-protocol = { path = "crates/rb-protocol" }
rb-dialer = { path = "crates/rb-dialer" }
rb-fswatch = { path = "crates/rb-fswatch" }
rb-certificate = { path = "crates/rb-certificate" }
rb-rule-set = { path = "crates/rb-rule-set" }
rb-tls = { path = "crates/rb-tls" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
regex = "1"
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
libc = "0.2"
httparse = "1"
rand = "0.9"
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
